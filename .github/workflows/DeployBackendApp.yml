name: Build and Deploy BackendApp to ECS

on:
  push:
    paths:
      - "backend/**"
    branches:
      - feat/video-cicd-ecs

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod # Specify the environment here
    env:
      # Setting an environment variable with the value of a configuration variable
      ECR_BACKEND_IMAGE: ${{ vars.ECR_BACKEND_IMAGE }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}

    steps:
      - name: Debug Environment Variables
        run: |
          echo "ECR_BACKEND_IMAGE=${{ vars.ECR_BACKEND_IMAGE }}"
          echo "AWS_DEFAULT_REGION=${{ vars.AWS_DEFAULT_REGION }}"
          echo "ECS_CLUSTER=${{ vars.ECS_CLUSTER }}"
          echo "ECS_BACKEND_SERVICE=${{ vars.ECS_BACKEND_SERVICE }}"

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU for arm64
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Set up Docker for arm64
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/arm64

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

      - name: Build and push Docker image
        run: |
          cd backend
          docker buildx create --use
          docker buildx inspect --bootstrap
          docker buildx build --platform linux/arm64 -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_DEFAULT_REGION }}.amazonaws.com/${{ vars.ECR_BACKEND_IMAGE }}:latest --push .

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_BACKEND_SERVICE }} \
            --force-new-deployment
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
